name = "study-buddy-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "study-buddy-db"
database_id = "27dcb6cb-cd52-48fd-85a7-c7694e19b2cf"

[vars]
# Non-secret defaults. Model names are not sensitive, so they live here.
# Google retires older models for new users (gemini-2.5-flash now returns 404),
# so if SAM errors, check the Worker logs for a 404 and update these names.
GEMINI_MODEL = "gemini-3.1-flash-lite"
# Used automatically when GEMINI_MODEL returns 503 (overloaded) or 429 (rate limit).
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
FIREBASE_PROJECT_ID = "lecture-feedback-e758b"
ALLOWED_ORIGIN = "https://kishanbellur.github.io"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   GEMINI_API_KEY      - from https://aistudio.google.com
#   ADMIN_EMAIL          - kishanbellur@gmail.com
#   CLASS_ACCESS_CODE    - the code you hand out to students this semester
